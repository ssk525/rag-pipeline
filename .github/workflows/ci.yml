name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest rank-bm25 langchain-core langchain-text-splitters langchain-community pypdf
      - name: Unit tests (no API keys)
        run: pytest -q
      - name: BM25 chunking comparison
        run: python run_retrieval_eval.py --bm25-only
